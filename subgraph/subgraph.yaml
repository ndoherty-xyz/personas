# subgraph/subgraph.yaml
specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Personas
    network: base-sepolia
    source:
      address: "0x049CC05539e8FAbF142Ddaa99A9259287E1457B0"
      abi: Personas
      startBlock: 35641946
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Association
        - Account
        - GlobalStats
      abis:
        - name: Personas
          file: ./abis/Personas.json
      eventHandlers:
        - event: AssociationCreated(indexed bytes32,indexed bytes32,indexed bytes32,(uint40,bytes2,bytes2,bytes,bytes,(bytes,bytes,uint40,uint40,bytes4,bytes)))
          handler: handleAssociationCreated
        - event: AssociationRevoked(indexed bytes32,indexed bytes32,uint256)
          handler: handleAssociationRevoked
        - event: ProposalCreated(indexed bytes32,indexed bytes32,(bytes,bytes,uint40,uint40,bytes4,bytes))
          handler: handleProposalCreated
        - event: ProposalAccepted(indexed bytes32,indexed bytes32)
          handler: handleProposalAccepted
        - event: ProposalRejected(indexed bytes32,indexed bytes32)
          handler: handleProposalRejected
      file: ./src/mapping.ts
